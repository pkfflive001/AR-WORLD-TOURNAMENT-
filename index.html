<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR WORLD TOURNAMENT - USER</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#070b1a;color:white}
header{padding:15px;text-align:center;background:#111a33;font-weight:bold}
.card{background:#1a1f35;margin:10px;padding:10px;border-radius:10px}
button{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;background:#ffcc00;font-weight:bold}
.google{background:#4285F4;color:white}
.hidden{display:none}
.slot{color:#00ffcc}
</style>
</head>

<body>

<header>🌍 AR WORLD TOURNAMENT</header>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h3>👤 Login Options</h3>
<p>Select method</p>

<button onclick="anonLogin()">🚀 Continue as Guest</button>
<button class="google" onclick="googleLogin()">🔵 Continue with Google</button>
</div>

<!-- USER PANEL -->
<div id="userPanel" class="hidden">

<div class="card">
<h3>👤 User ID</h3>
<p id="uid"></p>
</div>

<div class="card">
<h3>💰 Balance: <span id="bal">0</span></h3>
</div>

<div class="card">
<h3>🏆 Tournaments</h3>
<div id="tournaments"></div>
</div>

</div>

<script>

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user=null;

/* 🚀 GUEST LOGIN */
function anonLogin(){
auth.signInAnonymously()
.then(res=>{
user=res.user;
afterLogin("Guest");
})
.catch(err=>alert(err.message));
}

/* 🔵 GOOGLE LOGIN */
function googleLogin(){
const provider = new firebase.auth.GoogleAuthProvider();

auth.signInWithPopup(provider)
.then(res=>{
user=res.user;
afterLogin(res.user.displayName);
})
.catch(err=>alert(err.message));
}

/* ✅ COMMON AFTER LOGIN */
function afterLogin(name){

document.getElementById("loginBox").style.display="none";
document.getElementById("userPanel").classList.remove("hidden");

document.getElementById("uid").innerText =
user.uid + " (" + name + ")";

createUserDoc();
loadBalance();
loadTournaments();
}

/* 💾 USER DOC */
function createUserDoc(){
db.collection("users").doc(user.uid).set({
balance:0,
createdAt:Date.now()
},{merge:true});
}

/* 💰 BALANCE */
function loadBalance(){
db.collection("users").doc(user.uid)
.onSnapshot(doc=>{
document.getElementById("bal").innerText =
doc.data()?.balance || 0;
});
}

/* 🏆 TOURNAMENTS */
function loadTournaments(){
db.collection("tournaments").onSnapshot(s=>{
tournaments.innerHTML="";

s.forEach(d=>{
let t=d.data();

tournaments.innerHTML+=`
<div class="card">
<h3>🏆 ${t.title || "Tournament"}</h3>
<p>💰 Fee: ${t.fee || 0}</p>
<p class="slot">👥 Slots: ${t.joined || 0}/${t.slots || 0}</p>

<button onclick="join('${d.id}',${t.fee || 0},${t.slots || 0},${t.joined || 0})">
Join Tournament
</button>
</div>`;
});
});
}

/* 🎮 JOIN */
function join(id,fee,slots,joined){

db.collection("users").doc(user.uid).get().then(doc=>{
let bal=doc.data()?.balance || 0;

if(bal>=fee && joined<slots){

db.collection("users").doc(user.uid).update({
balance:bal-fee
});

db.collection("tournaments").doc(id).update({
joined:joined+1
});

db.collection("joins").add({
uid:user.uid,
tid:id,
time:Date.now()
});

alert("🎉 Joined Successfully!");
}
else{
alert("❌ Not enough balance or slots full");
}
});
}

</script>

</body>
</html>
