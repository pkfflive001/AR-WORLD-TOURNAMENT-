<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Login</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#070b1a;color:white}
.card{background:#1a1f35;margin:10px;padding:10px;border-radius:10px}
input,button{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none}
button{background:#ffcc00;font-weight:bold}
</style>
</head>

<body>

<div class="card">
<h3>📱 Phone Number Login</h3>

<input id="phone" placeholder="+92XXXXXXXXXX">
<div id="recaptcha-container"></div>

<button onclick="sendOTP()">Send OTP</button>

<input id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify</button>

</div>

<div class="card" id="userBox" style="display:none">
<h3>✅ Login Successful</h3>
<p id="userPhone"></p>
</div>

<script>

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

let confirmationResult;

/* 🔐 Recaptcha */
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
'recaptcha-container',
{
  size: 'normal'
}
);

/* 📱 SEND OTP */
function sendOTP(){

let phone = document.getElementById("phone").value;

auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
.then(result=>{
confirmationResult = result;
alert("OTP Sent");
})
.catch(err=>{
alert(err.message);
});

}

/* 🔑 VERIFY OTP */
function verifyOTP(){

let code = document.getElementById("otp").value;

confirmationResult.confirm(code)
.then(result=>{
let user = result.user;

document.getElementById("userBox").style.display="block";
document.getElementById("userPhone").innerText = user.phoneNumber;

alert("Login Successful");
})
.catch(err=>{
alert("Wrong OTP");
});

}

</script>

</body>
</html>
